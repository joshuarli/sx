[project]
name = "sx"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
sx = "sx.cli:main"

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["cores/*"]

[tool.uv.sources]
sx-text = { workspace = true }
sx-semver = { workspace = true }

[dependency-groups]
dev = [
    "ty>=0.0.84",
    "pytest>=9.1.1",
    "ruff>=0.15",
    "sx-text",
    "sx-semver",
]

[tool.pytest.ini_options]
testpaths = ["tests", "cores"]
pythonpath = ["bench/codemode"]

[tool.ty.environment]
root = ["src", "tests", "bench", "bench/codemode", "cores/text/src", "cores/semver/src"]
python-version = "3.15"
python-platform = "darwin"

[tool.ty.src]
include = ["src", "tests", "bench", "cores"]

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
respect-type-ignore-comments = false

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["src", "bench"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "A", "SIM", "RUF", "PT", "RET", "PIE", "C4", "T20", "PERF", "FURB"]
ignore = ["T201", "RET505", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["sx"]
