[package]
name = "sx-packs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
sx-kernel = { path = "../sx-kernel" }
libc = { version = "0.2", default-features = false }
h12tiny = { version = "0.7", default-features = false, features = ["client-sync", "tls"] }
