[package]
name = "sx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sx"
path = "src/main.rs"

[[bin]]
name = "mcp-fixture"
path = "tests/support/mcp_fixture.rs"
test = false
doc = false

[lints]
workspace = true

[dependencies]
sx-kernel = { path = "../sx-kernel" }
sx-cores = { path = "../sx-cores" }
sx-packs = { path = "../sx-packs" }
sx-ts = { path = "../sx-ts" }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = { version = "0.4", default-features = false }
