[workspace]
resolver = "3"
members = ["sx-kernel", "sx-cli", "sx-cores"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
deser = "0.10.2"
deser-json = "0.10.2"
deser-value = "0.10.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
